# 예시: 저장한 DroidLens 스크립트를 에뮬레이터에서 돌려 PR 검사로 쓰는 GitHub Actions 워크플로.
# 앱 저장소의 .github/workflows/ 에 복사해 경로만 고쳐 쓴다.
#   - regression/ : script_run 으로 통과시켜 저장한 YAML 스크립트 폴더 (~/.droidlens/scripts 에서 복사)
#   - droidlens-mcp.mjs : DroidLens 릴리스에서 받는다 (DROIDLENS_VERSION 을 쓰는 버전으로 고정)
# 에뮬레이터에는 온디바이스 에이전트를 설치하지 않아도 된다 (uiautomator 로 동작, ASCII 입력만).
name: UI regression
on:
  pull_request:

env:
  DROIDLENS_VERSION: v0.11.0

jobs:
  droidlens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Download DroidLens MCP
        run: curl -fsSL -o droidlens-mcp.mjs "https://github.com/ESeungJun/droidlens/releases/download/${DROIDLENS_VERSION}/droidlens-mcp.mjs"
      # KVM 을 켜야 에뮬레이터가 쓸 만한 속도로 돈다
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run scripts on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            DROIDLENS_AGENT=0 node droidlens-mcp.mjs run regression --junit droidlens-junit.xml --summary droidlens-summary.md
      - name: Job summary
        if: always()
        run: cat droidlens-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidlens-report
          path: |
            droidlens-junit.xml
            droidlens-summary.md
            ~/.droidlens/scenarios
