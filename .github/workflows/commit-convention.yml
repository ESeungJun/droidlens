name: Commit convention
on:
  push:
    branches: [master, develop]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR 제목 검사 (머지 커밋 제목이 된다)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' || { echo "::error::PR 제목에 Conventional Commits 프리픽스가 필요합니다: $TITLE"; exit 1; }
      - name: 커밋 메시지 검사
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="${RANGE#*..}~1..${RANGE#*..}";; esac
          bad=$(git log --format='%h %s' "$RANGE" | grep -Ev '^[0-9a-f]+ (feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' || true)
          if [ -n "$bad" ]; then
            echo "::error::프리픽스가 없는 커밋이 있습니다"
            echo "$bad"
            exit 1
          fi
