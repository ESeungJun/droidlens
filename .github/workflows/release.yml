name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Gradle 배포판(wrapper)과 의존성을 캐시한다. 매번 services.gradle.org 에서 받다가 504·시간 초과로 깨지던 것을 막는다
          cache: gradle
      # 서명 Secrets 를 쓰는 작업이라 의존성 설치 스크립트는 돌리지 않는다 (Electron 은 electron-builder 가 직접 받는다)
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Build on-device agent APK
        working-directory: android
        shell: bash
        # 캐시가 없을 때 Gradle 배포판 다운로드가 일시적으로 실패하면 두 번까지 다시 시도한다
        run: |
          for i in 1 2 3; do
            ./gradlew :agent:assembleRelease --no-daemon && exit 0
            echo "::warning::Gradle 실패 ($i/3), 다시 시도"; sleep $((i * 20))
          done
          exit 1
      - name: Fetch scrcpy server (SHA256 검증)
        run: node scripts/fetch-scrcpy.mjs
      - name: Package
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        run: pnpm exec electron-vite build && pnpm exec electron-builder ${{ matrix.target }} --publish never
      # 서명 인증서·공증 키는 이 단계에만 넘긴다
      - name: Package (macOS, 서명 + 공증)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::macOS 서명용 Secrets 가 없습니다"; exit 1
          fi
          # 인증서는 직접 만든 임시 키체인에 넣는다 (electron-builder 가 CSC_LINK 로 만드는
          # 키체인은 macOS 26 러너에서 잠금 해제가 안 된다)
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" # electron-builder 는 공증 키를 파일 경로로 받는다
          trap 'security delete-keychain "$keychain" 2>/dev/null; rm -f "$RUNNER_TEMP/cert.p12" "$APPLE_API_KEY"' EXIT
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # forceCodeSigning: 서명에 실패하면 임시 서명으로 넘어가지 않고 실패시킨다
          pnpm exec electron-vite build && pnpm exec electron-builder ${{ matrix.target }} --publish never -c.mac.forceCodeSigning=true
      - name: 서명·공증 확인 (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          for app in release/mac*/*.app; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          done
      # 앱 업데이터(updater.ts)는 GitHub API로 OS·칩별 파일을 직접 받으므로
      # electron-updater용 latest*.yml 과 x64+arm64 합본 설치 파일은 올리지 않는다.
      # 부분 업데이트용 blockmap 은 release 작업에서 올리는 파일 그대로를 기준으로 다시 만든다
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*-mac-*.dmg
            apps/desktop/release/*-mac-*.zip
            apps/desktop/release/*-win-x64.exe
            apps/desktop/release/*-win-arm64.exe
            apps/desktop/release/*.AppImage

  release:
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          # 노트 대체 경로에서 이전 태그를 찾으려면 태그와 이력이 있어야 한다
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Gradle 배포판(wrapper)과 의존성을 캐시한다. 매번 services.gradle.org 에서 받다가 504·시간 초과로 깨지던 것을 막는다
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build on-device agent APK
        working-directory: android
        # 캐시가 없을 때 Gradle 배포판 다운로드가 일시적으로 실패하면 두 번까지 다시 시도한다
        run: |
          for i in 1 2 3; do
            ./gradlew :agent:assembleRelease --no-daemon && exit 0
            echo "::warning::Gradle 실패 ($i/3), 다시 시도"; sleep $((i * 20))
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd agents && zip ../droidlens-agents.zip *.md && cd ..
          cp android/agent/build/outputs/apk/release/agent-release.apk droidlens-agent.apk
          # 앱 업데이터가 받는 파일(zip·exe·AppImage)마다 부분 업데이트용 조각 정보를 만든다
          node scripts/blockmaps.mjs dist/*-mac-*.zip dist/*-win-*.exe dist/*.AppImage
          files="dist/* packages/mcp/dist/droidlens-mcp.mjs droidlens-agent.apk droidlens-agents.zip"
          # 설치 스크립트·앱 업데이터가 받은 파일을 대조하는 체크섬 목록 (파일 이름만 남김)
          sha256sum $files | sed -E 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS
          files="$files SHA256SUMS"
          TAG="${GITHUB_REF_NAME}"
          # GitHub API 가 가끔 5xx 를 돌려준다 (v0.10.5 때 502·500). 각 호출을 몇 번 다시 시도한다
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "::warning::실패 ($i/4): $1 $2 $3, 다시 시도"; sleep $((i * 15)); done; return 1; }
          # 노트는 GitHub 자동 생성을 먼저 쓰고, 그 API 가 안 되면 이전 태그부터의 커밋 제목으로 만든다
          notes() {
            # 실패하면 gh 가 오류 JSON 을 stdout 에 찍으므로, 성공했을 때만 내보낸다
            if body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" -q .body 2>/dev/null) && [ -n "$body" ]; then echo "$body"; return; fi
            prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            echo "## What's Changed"
            git log --first-parent --format='* %s' ${prev:+"$prev..$TAG"} | head -50
            [ -n "$prev" ] && printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$TAG"
          }
          # 초안으로 먼저 만들고, 파일을 다 올린 뒤에 공개한다 (파일 없는 '최신' 릴리스를 업데이터가 보지 않게)
          ensure_release() { gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes "$(notes)"; }
          retry ensure_release
          retry gh release upload "$TAG" $files --clobber
          retry gh release edit "$TAG" --draft=false --latest
