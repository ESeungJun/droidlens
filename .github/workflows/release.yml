name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build on-device agent APK
        working-directory: android
        shell: bash
        run: ./gradlew :agent:assembleRelease --no-daemon
      - name: Fetch scrcpy server (SHA256 검증)
        run: node scripts/fetch-scrcpy.mjs
      - name: Package
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        run: pnpm exec electron-vite build && pnpm exec electron-builder ${{ matrix.target }} --publish never
      # 서명 인증서·공증 키는 이 단계에만 넘긴다
      - name: Package (macOS, 서명 + 공증)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::macOS 서명용 Secrets 가 없습니다"; exit 1
          fi
          # electron-builder 는 공증 키를 파일 경로로 받는다
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          # forceCodeSigning: 서명에 실패하면 임시 서명으로 넘어가지 않고 실패시킨다
          pnpm exec electron-vite build && pnpm exec electron-builder ${{ matrix.target }} --publish never -c.mac.forceCodeSigning=true
      - name: 서명·공증 확인 (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          for app in release/mac*/*.app; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          done
      # 앱 업데이터(updater.ts)는 GitHub API로 OS·칩별 파일을 직접 받으므로
      # electron-updater용 blockmap·latest*.yml 과 x64+arm64 합본 설치 파일은 올리지 않는다
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*-mac-*.dmg
            apps/desktop/release/*-mac-*.zip
            apps/desktop/release/*-win-x64.exe
            apps/desktop/release/*-win-arm64.exe
            apps/desktop/release/*.AppImage

  release:
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build on-device agent APK
        working-directory: android
        run: ./gradlew :agent:assembleRelease --no-daemon
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd agents && zip ../droidlens-agents.zip *.md && cd ..
          cp android/agent/build/outputs/apk/release/agent-release.apk droidlens-agent.apk
          files="dist/* packages/mcp/dist/droidlens-mcp.mjs droidlens-agent.apk droidlens-agents.zip"
          # 설치 스크립트·앱 업데이터가 받은 파일을 대조하는 체크섬 목록 (파일 이름만 남김)
          sha256sum $files | sed -E 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS
          files="$files SHA256SUMS"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" $files --clobber
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          else
            gh release create "${GITHUB_REF_NAME}" $files --title "${GITHUB_REF_NAME}" --generate-notes --latest
          fi
