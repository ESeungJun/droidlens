name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build on-device agent APK
        working-directory: android
        shell: bash
        run: ./gradlew :agent:assembleRelease --no-daemon
      - name: Fetch scrcpy server (SHA256 검증)
        run: node scripts/fetch-scrcpy.mjs
      - name: Package
        working-directory: apps/desktop
        run: pnpm exec electron-vite build && pnpm exec electron-builder ${{ matrix.target }} --publish never
      # 앱 업데이터(updater.ts)는 GitHub API로 OS·칩별 파일을 직접 받으므로
      # electron-updater용 blockmap·latest*.yml 과 x64+arm64 합본 설치 파일은 올리지 않는다
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*-mac-*.dmg
            apps/desktop/release/*-mac-*.zip
            apps/desktop/release/*-win-x64.exe
            apps/desktop/release/*-win-arm64.exe
            apps/desktop/release/*.AppImage

  release:
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build on-device agent APK
        working-directory: android
        run: ./gradlew :agent:assembleRelease --no-daemon
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd agents && zip ../droidlens-agents.zip *.md && cd ..
          cp android/agent/build/outputs/apk/release/agent-release.apk droidlens-agent.apk
          files="dist/* packages/mcp/dist/droidlens-mcp.mjs droidlens-agent.apk droidlens-agents.zip"
          # 설치 스크립트·앱 업데이터가 받은 파일을 대조하는 체크섬 목록 (파일 이름만 남김)
          sha256sum $files | sed -E 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS
          files="$files SHA256SUMS"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" $files --clobber
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          else
            gh release create "${GITHUB_REF_NAME}" $files --title "${GITHUB_REF_NAME}" --generate-notes --latest
          fi
