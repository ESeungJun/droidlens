appId: io.github.eseungjun.droidlens
productName: DroidLens
copyright: Copyright © 2026 ESeungJun
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
npmRebuild: false
extraResources:
  - from: ../../packages/mcp/dist/droidlens-mcp.mjs
    to: mcp/droidlens-mcp.mjs
  - from: ../../android/agent/build/outputs/apk/release/agent-release.apk
    to: agent/droidlens-agent.apk
  - from: ../../agents
    to: agents
    filter: ['*.md']
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: ESeungJun
  repo: droidlens
  releaseType: release
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null # 코드 서명 인증서 없음 → 첫 실행 시 Gatekeeper 우회 필요 (README 참고)
dmg:
  title: ${productName} ${version}
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: droidlens
  category: Development
  target:
    - target: AppImage
      arch: [x64]
