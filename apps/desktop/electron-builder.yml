appId: io.github.eseungjun.droidlens
productName: DroidLens
copyright: Copyright © 2026 ESeungJun
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
npmRebuild: false
extraResources:
  - from: ../../packages/mcp/dist/droidlens-mcp.mjs
    to: mcp/droidlens-mcp.mjs
  - from: ../../android/agent/build/outputs/apk/release/agent-release.apk
    to: agent/droidlens-agent.apk
  - from: ../../vendor/scrcpy
    to: scrcpy
    filter: ['scrcpy-server', 'NOTICE.txt', 'VERSION']
  - from: ../../agents
    to: agents
    filter: ['*.md']
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: ESeungJun
  repo: droidlens
  releaseType: release
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 릴리스 빌드는 Developer ID 인증서(CSC_LINK)로 서명하고 Apple 공증을 받는다 (release.yml).
  # 공증에는 hardened runtime 이 필요하고, 권한은 electron-builder 기본 entitlements 를 쓴다.
  # 인증서가 없는 로컬 빌드는 electron-builder 가 임시(ad-hoc) 서명으로 대신한다
  hardenedRuntime: true
dmg:
  title: ${productName} ${version}
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: droidlens
  category: Development
  target:
    - target: AppImage
      arch: [x64]
