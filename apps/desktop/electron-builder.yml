appId: io.github.eseungjun.droidlens
productName: DroidLens
copyright: Copyright © 2026 ESeungJun
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
npmRebuild: false
extraResources:
  - from: ../../packages/mcp/dist/droidlens-mcp.mjs
    to: mcp/droidlens-mcp.mjs
  - from: ../../android/agent/build/outputs/apk/release/agent-release.apk
    to: agent/droidlens-agent.apk
  - from: ../../vendor/scrcpy
    to: scrcpy
    filter: ['scrcpy-server', 'NOTICE.txt', 'VERSION']
  - from: ../../agents
    to: agents
    filter: ['*.md']
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: ESeungJun
  repo: droidlens
  releaseType: release
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 유료 인증서 없이 임시(ad-hoc) 서명으로 앱 묶음 전체를 서명한다.
  # 서명하지 않으면 실행 파일만 링커 서명돼 묶음 서명이 깨지고 macOS 가 '손상됨'으로 막는다.
  # 임시 서명이면 '확인할 수 없는 개발자'로 바뀌어 시스템 설정 → 개인정보 보호 및 보안 → '그래도 열기'로 실행할 수 있다
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: ${productName} ${version}
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: droidlens
  category: Development
  target:
    - target: AppImage
      arch: [x64]
